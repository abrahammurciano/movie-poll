name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firestore-rules.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/145570390573/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-hosting@movie-poll-6ee55.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project movie-poll-6ee55 --non-interactive
