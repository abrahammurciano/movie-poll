<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a47"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dffb8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#badge)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#34d399" stroke-opacity="0.28" stroke-width="6"/>

  <!-- clapper slate (top bar, hinged open) -->
  <g transform="rotate(-9 108 212)">
    <rect x="96" y="156" width="320" height="56" rx="14" fill="url(#slate)"/>
    <g fill="#0e1626">
      <path d="M126 156h34l-28 56h-34z"/>
      <path d="M206 156h34l-28 56h-34z"/>
      <path d="M286 156h34l-28 56h-34z"/>
      <path d="M366 156h34l-28 56h-34z"/>
    </g>
    <!-- hinge -->
    <circle cx="108" cy="212" r="17" fill="#0e1626"/>
    <circle cx="108" cy="212" r="8" fill="#7dffb8"/>
  </g>

  <!-- board body -->
  <rect x="96" y="222" width="320" height="176" rx="22" fill="url(#board)"/>

  <!-- the vote: bold check, fully inside the board -->
  <path d="M168 314l52 54 124-128" fill="none" stroke="#0e1626" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
